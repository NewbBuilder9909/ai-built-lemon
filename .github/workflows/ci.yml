name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1'

permissions:
  contents: read

# A new push to a pull request makes its running check moot, so cancel it.
# Every other run (main, the weekly schedule, manual) gets a group of its own
# and always finishes: grouping them would let GitHub drop a queued run for
# an intermediate main commit, and each main commit keeps its own evidence.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # No later step pushes or fetches, so the token is not left in .git/config.
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Capture clean revision provenance
        shell: pwsh
        run: ./scripts/collect-ithc-evidence.ps1 -RequireClean

      - name: Start disposable SQL Server
        shell: bash
        run: |
          sql_password="$(openssl rand -hex 32)Aa1!"
          echo "::add-mask::$sql_password"
          export MSSQL_SA_PASSWORD="$sql_password"
          docker run --detach --name sqlserver \
            --env ACCEPT_EULA=Y --env MSSQL_SA_PASSWORD \
            --publish 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          echo "PP_TEST_SQL_CONNECTION=Server=127.0.0.1,1433;Database=UmbracoBase_IntegrationTests;User Id=sa;Password=$sql_password;Encrypt=True;TrustServerCertificate=True;" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$sql_password" -C -Q 'SELECT 1' > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'SQL Server did not become ready within 120 seconds.' >&2
          exit 1

      - name: Restore
        run: dotnet restore

      # RazorCompileOnBuild is false (required by Umbraco's InMemoryAuto models
      # mode), so the Build step below does not look at .cshtml files at all —
      # a broken view produces a green build and a runtime 500. This compiles
      # them explicitly. Runs before Build and in the default Debug
      # configuration, so it cannot disturb the Release artifact Test consumes.
      - name: Check Razor views
        shell: pwsh
        run: ./scripts/check-views.ps1

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test ProgrammePulse.Tests/ProgrammePulse.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName!~Integration&FullyQualifiedName!~Personas" --logger "trx;LogFileName=unit-test-results.trx"

      - name: Integration and render tests
        run: dotnet test ProgrammePulse.Tests/ProgrammePulse.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~Integration|FullyQualifiedName~Personas" --logger "trx;LogFileName=integration-test-results.trx"
        env:
          PP_REQUIRE_SQL_TESTS: "1"

      - name: Stop disposable SQL Server
        if: always()
        run: docker rm --force sqlserver

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: "**/*test-results.trx"

      - name: Upload revision provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: revision-provenance
          path: artifacts/security/ithc-*/**
          if-no-files-found: error
          retention-days: 90

      - name: Check for vulnerable NuGet packages
        shell: pwsh
        run: ./scripts/test-dependency-audit.ps1

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audit
          path: artifacts/security/nuget-vulnerabilities.json
          retention-days: 90

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      # Full history, not just the tip commit — a secret committed and then
      # removed in a later commit is still a leaked secret; scanning only
      # HEAD would miss it.
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks CLI directly, not the gitleaks-action wrapper — the
      # wrapper action requires a paid license for private repositories;
      # the underlying open-source scanner does not. Pinned to a specific
      # release rather than "latest" so this step doesn't silently start
      # behaving differently on a future gitleaks release.
      - name: Install and run gitleaks
        run: |
          curl --fail --silent --show-error --location -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --report-format json --report-path gitleaks-report.json

      - name: Upload redacted secret scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: secret-scan
          path: gitleaks-report.json
          retention-days: 90
